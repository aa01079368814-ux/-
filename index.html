<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나만의 단어 셔플 & PDF</title>
    <!-- PDF를 만들어주는 도구를 인터넷에서 빌려오는 코드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">

    <h1>영어 단어 무작위 PDF 만들기</h1>
    <p>아래 칸에 단어를 줄바꿈해서 적어주세요!</p>
    
    <!-- 단어를 적는 칸 -->
    <textarea id="wordInput" rows="10" cols="30" placeholder="apple&#10;banana&#10;cat"></textarea>
    <br><br>
    
    <!-- 다운로드 버튼 -->
    <button id="downloadBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">PDF 다운로드</button>

    <script>
        // 버튼을 누르면 작동하는 코드
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const text = document.getElementById('wordInput').value;
            
            // 줄바꿈 기준으로 단어 나누기
            let words = text.split('\n').filter(w => w.trim() !== '');
            
            if (words.length === 0) {
                alert('단어를 먼저 입력해주세요!');
                return;
            }

            // 단어 순서를 무작위로 섞기 (랜덤 셔플)
            for (let i = words.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [words[i], words[j]] = [words[j], words[i]];
            }

            // PDF로 변환할 화면 만들기
            const box = document.createElement('div');
            box.style.padding = '20px';
            box.innerHTML = '<h2>내가 만든 무작위 단어장</h2><ul>' + words.map(w => `<li>${w}</li>`).join('') + '</ul>';

            // PDF 저장 실행!
            html2pdf().from(box).save('my_words.pdf');
        });
    </script>

</body>
</html>
